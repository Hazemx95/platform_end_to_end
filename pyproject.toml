[project]
name = "code-advanced-logic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pyspark>=4.2.0",
]

[project.scripts]
code-advanced-logic = "code_advanced_logic:main"
bronze-ingest = "utils.platform_package.bronz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_advanced_logic", "utils"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
